version: '3.8'

services:
  nats:
    image: nats:alpine
    ports:
      - "4222:4222"
      - "8222:8222"

  test:
    image: golang:1.25-alpine
    depends_on:
      - nats
    working_dir: /app
    volumes:
      - .:/app
    environment:
      NATS_URL: nats://nats:4222
      NATS_QUEUE_NAME: testing
    command: sh -c "sleep 5 && go test -mod=vendor -v ./..."
